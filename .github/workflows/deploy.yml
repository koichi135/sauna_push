name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも流せるようにしておく
  workflow_dispatch:

# GITHUB_TOKEN に Pages への書き込みと OIDC を許可する
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの同時実行を防ぐ。実行中のものはキャンセルしない
# （途中で切ると Pages が中途半端な状態で公開されうるため）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # npm run build は tsc --noEmit と vite build の両方を走らせる。
      # 型エラーがあればここで落ちて、壊れたものが公開されない。
      - name: ビルド
        run: npm run build

      # enablement: true を付けると、リポジトリ設定で Pages が未設定でも
      # ソースを GitHub Actions にして有効化を試みる。
      # 権限の都合で失敗する場合は Settings > Pages で手動設定すること。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
